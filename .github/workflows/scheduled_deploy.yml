# ==============================================================================
# PIPELINE PROGRAMADO POR HORARIO (CRON) - PORTAFOLIO
# ==============================================================================
# Este flujo se ejecuta automáticamente a una hora determinada del día.
# Antes de hacer nada, comprueba si hay cambios pendientes en 'dev' que no estén en 'main'.
# - Si NO hay cambios nuevos en 'dev': Finaliza limpiamente sin hacer nada innecesario.
# - Si SÍ hay cambios nuevos: Valida la compilación, hace el merge a 'main' y despliega.
# ==============================================================================

name: Scheduled Portfolio Deployment

# ------------------------------------------------------------------------------
# DISPARADORES (TRIGGERS): Horario programado (Cron) y ejecución manual
# ------------------------------------------------------------------------------
on:
  schedule:
    # Formato Cron UTC: Minuto Hora DíaMes Mes DíaSemana
    # 15 14 * * * -> Programado a las 14:15 UTC (Equivale a las 11:15 AM Argentina UTC-3)
    - cron: "10 14 * * *"
  workflow_dispatch: # Permite probarlo manualmente cuando quieras desde GitHub Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # ETAPA 1: VERIFICAR CAMBIOS EN DEV Y VALIDAR COMPILACIÓN
  # ----------------------------------------------------------------------------
  check-and-validate:
    name: 1. Comprobar Diferencias y Validar Dev
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_diff.outputs.has_changes }}
    steps:
      - name: 1.1 Descargar todo el historial de git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 1.2 Comparar si 'dev' tiene commits que no están en 'main'
        id: check_diff
        run: |
          git fetch origin main dev
          # Cuenta cuántos commits tiene 'dev' por delante de 'main'
          COMMITS_AHEAD=$(git rev-list --count origin/main..origin/dev)
          echo "Commits pendientes en dev: $COMMITS_AHEAD"

          if [ "$COMMITS_AHEAD" -eq "0" ]; then
            echo "No hay cambios nuevos en 'dev'. Se omite la ejecución."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Se encontraron $COMMITS_AHEAD cambios nuevos en 'dev'."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: 1.3 Configurar Node.js (solo si hay cambios)
        if: steps.check_diff.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 1.4 Instalar dependencias (solo si hay cambios)
        if: steps.check_diff.outputs.has_changes == 'true'
        run: npm ci

      - name: 1.5 Validar compilación en dev (solo si hay cambios)
        if: steps.check_diff.outputs.has_changes == 'true'
        run: npm run build

  # ----------------------------------------------------------------------------
  # ETAPA 2: SINCRONIZAR DEV -> MAIN (Solo si hay cambios y la validación pasó)
  # ----------------------------------------------------------------------------
  sync-dev-to-main:
    name: 2. Sincronizar dev hacia main
    needs: [check-and-validate]
    if: needs.check-and-validate.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 2.1 Descargar historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2.2 Configurar usuario Git del Bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 2.3 Traer main, hacer merge de dev y subir a GitHub
        run: |
          git fetch origin main dev
          git checkout main
          git merge origin/dev --no-ff -m "ci: scheduled auto-sync dev to main"
          git push origin main

  # ----------------------------------------------------------------------------
  # ETAPA 3: COMPILAR Y DESPLEGAR A GITHUB PAGES (Solo si hubo sincronización exitosa)
  # ----------------------------------------------------------------------------
  build-and-deploy:
    name: 3. Compilación Final y Despliegue a Pages
    needs: [check-and-validate, sync-dev-to-main]
    if: needs.check-and-validate.outputs.has_changes == 'true' && needs.sync-dev-to-main.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 3.1 Descargar código fuente de la rama main
        uses: actions/checkout@v4
        with:
          ref: "main"

      - name: 3.2 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 3.3 Instalar dependencias
        run: npm ci

      - name: 3.4 Compilar para Producción
        run: npm run build

      - name: 3.5 Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 3.6 Empaquetar carpeta dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: 3.7 Publicar el sitio a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
